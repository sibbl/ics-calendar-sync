services:
  calendar-sync:
    build: .
    image: ics-google-calendar-sync:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      APP_ADMIN_TOKEN: ${APP_ADMIN_TOKEN:?Set APP_ADMIN_TOKEN locally}
      SOURCES_JSON: ${SOURCES_JSON:-[]}
      WATCH_ROOT: /sources
      HOST: 0.0.0.0
      PORT: 8080
      ENABLE_GOOGLE_WRITES: ${ENABLE_GOOGLE_WRITES:-false}
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REFRESH_TOKEN: ${GOOGLE_REFRESH_TOKEN:-}
    volumes:
      - type: bind
        source: ${ICS_SOURCE_DIR:-./ics}
        target: /sources
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
